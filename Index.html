<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App Game</title>
    <!-- Telegram WebApp SDK для получения реального ID -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .user-info h3 {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .user-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .balance-card {
            text-align: center;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .balance-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--gold);
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .click-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, var(--accent) 0%, var(--accent-hover) 100%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            outline: none;
        }

        .click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .ref-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .ref-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .ref-stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Данные игрока из Telegram -->
    <div class="card profile-header">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
            <h3 id="user-name">Загрузка...</h3>
            <p>ID: <span class="badge" id="user-id">00000000</span></p>
        </div>
    </div>

    <!-- Игровой баланс -->
    <div class="card balance-card">
        <div class="balance-title">Ваш Баланс</div>
        <div class="balance-value">⚡ <span id="balance">0</span></div>
    </div>

    <!-- Кликер -->
    <div class="click-area">
        <button class="click-btn" id="click-btn">🚀</button>
    </div>

    <!-- Реферальная система -->
    <div class="card">
        <div class="ref-title">🤝 Реферальная программа</div>
        <div class="ref-desc">
            Приглашайте друзей по вашей личной ссылке и получайте +500 монеток за каждого реферала!
        </div>
        
        <div class="ref-stats">
            <span>Приглашено друзей:</span>
            <strong id="ref-count">0</strong>
        </div>

        <button class="btn" id="copy-ref-btn">Скопировать реф-ссылку</button>
    </div>
</div>

<script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на весь экран

    // Имя бота (ЗАМЕНИТЕ НА ИМЯ ВАШЕГО БОТА!)
    const BOT_USERNAME = "YourBotUsername_bot";

    // Получаем реальные данные игрока из API Telegram
    const user = tg.initDataUnsafe?.user || {};
    const userId = user.id || "LocalDev123";
    const firstName = user.first_name || "Игрок";
    const lastName = user.last_name || "";
    const fullName = `${firstName} ${lastName}`.trim();

    // Отрисовка профиля
    document.getElementById("user-name").innerText = fullName;
    document.getElementById("user-id").innerText = userId;
    document.getElementById("user-avatar").innerText = firstName.charAt(0).toUpperCase();

    // Загрузка данных из локального хранилища (привязана к реальному Telegram ID)
    let balance = parseInt(localStorage.getItem(`balance_${userId}`)) || 0;
    let refCount = parseInt(localStorage.getItem(`refCount_${userId}`)) || 0;
    let hasProcessedRef = localStorage.getItem(`refProcessed_${userId}`);

    document.getElementById("balance").innerText = balance;
    document.getElementById("ref-count").innerText = refCount;

    // Проверка реферального параметра из ссылки запуска Telegram Mini App
    const startParam = tg.initDataUnsafe?.start_param;
    if (startParam && !hasProcessedRef) {
        const referrerId = startParam;
        
        // Защита: нельзя быть рефералом самого себя
        if (referrerId !== String(userId)) {
            // Начисление бонуса пригласившему
            let refBalance = parseInt(localStorage.getItem(`balance_${referrerId}`)) || 0;
            let refFriends = parseInt(localStorage.getItem(`refCount_${referrerId}`)) || 0;
            
            localStorage.setItem(`balance_${referrerId}`, refBalance + 500);
            localStorage.setItem(`refCount_${referrerId}`, refFriends + 1);

            // Бонус новому игроку за запуск по рефералке
            balance += 100;
            localStorage.setItem(`balance_${userId}`, balance);
            document.getElementById("balance").innerText = balance;

            // Пометка, что реферал засчитан
            localStorage.setItem(`refProcessed_${userId}`, "true");
            tg.showAlert("Вы успешно зарегистрировались по реферальной ссылке и получили +100 монет!");
        }
    }

    // Обработка нажатий на кнопку-кликер
    const clickBtn = document.getElementById("click-btn");
    clickBtn.addEventListener("click", () => {
        balance += 1;
        document.getElementById("balance").innerText = balance;
        localStorage.setItem(`balance_${userId}`, balance);

        // Легкая вибрация при клике (если поддерживается устройством)
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred("light");
        }
    });

    // Генерация и копирование реферальной ссылки
    const copyBtn = document.getElementById("copy-ref-btn");
    copyBtn.addEventListener("click", () => {
        // Уникальная реф-ссылка с параметром startapp=ID
        const refLink = `https://t.me/${BOT_USERNAME}/start?startapp=${userId}`;
        
        navigator.clipboard.writeText(refLink).then(() => {
            tg.showAlert("Ваша реферальная ссылка скопирована в буфер обмена!");
        }).catch(() => {
            tg.showAlert(`Ваша ссылка:\n${refLink}`);
        });
    });
</script>
</body>
</html>
