<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram WebApp Ultimate Portal</title>
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --link-color: var(--tg-theme-link-color, #38bdf8);
            --button-color: var(--tg-theme-button-color, #6366f1);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --accent-glow: rgba(99, 102, 241, 0.3);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --card-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .animated {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Шапка */
        header {
            background: var(--secondary-bg);
            padding: 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--button-color), var(--link-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .user-info h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .user-info p {
            font-size: 13px;
            color: var(--hint-color);
            margin-top: 2px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--link-color);
            margin-top: 5px;
        }

        /* Навигация (Табы) */
        .tabs {
            display: flex;
            justify-content: space-around;
            background: var(--secondary-bg);
            margin: 0 15px 20px 15px;
            padding: 5px;
            border-radius: 14px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--hint-color);
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        /* Контент разделов */
        .tab-content {
            display: none;
            padding: 0 15px;
        }

        .tab-content.active {
            display: block;
        }

        /* Карточки */
        .card {
            background: var(--secondary-bg);
            border-radius: var(--card-radius);
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Формы и Инпуты */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--button-color);
        }

        /* Кнопки */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--button-color);
            color: var(--button-text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger-color);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Списки */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Лог / Дебаг консоль */
        .console-log {
            background: #000000;
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            padding: 12px;
            border-radius: 10px;
            height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <header class="animated">
        <div class="user-profile">
            <div class="avatar" id="avatar">?</div>
            <div class="user-info">
                <h2 id="userName">Загрузка...</h2>
                <p id="userHandle">@username</p>
                <span class="badge" id="userPlatform">Telegram WebApp</span>
            </div>
        </div>
    </header>

    <!-- Переключатель вкладок -->
    <div class="tabs animated">
        <button class="tab-btn active" onclick="switchTab('data-tab', this)">Данные</button>
        <button class="tab-btn" onclick="switchTab('tg-tab', this)">Telegram SDK</button>
        <button class="tab-btn" onclick="switchTab('settings-tab', this)">Настройки</button>
    </div>

    <!-- Вкладка 1: Работа с локальными данными -->
    <div id="data-tab" class="tab-content active animated">
        <div class="card">
            <div class="card-title">💾 Сохранение в LocalStorage</div>
            <div class="form-group">
                <label>Заметка / Запись</label>
                <input type="text" id="noteInput" placeholder="Введите текст...">
            </div>
            <div class="grid-2">
                <button class="btn" onclick="saveNote()">Сохранить</button>
                <button class="btn btn-secondary" onclick="clearNotes()">Очистить</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📜 Сохранённые записи</div>
            <div id="notesContainer">
                <p style="color: var(--hint-color); font-size: 13px;">Записей пока нет.</p>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Telegram Функции -->
    <div id="tg-tab" class="tab-content animated">
        <div class="card">
            <div class="card-title">⚡ Управление Интерфейсом</div>
            <div class="grid-2" style="margin-bottom: 10px;">
                <button class="btn btn-secondary" onclick="toggleMainButton()">MainButton</button>
                <button class="btn btn-secondary" onclick="toggleBackButton()">BackButton</button>
            </div>
            <div class="grid-2">
                <button class="btn btn-secondary" onclick="triggerHaptic()">Вибрация</button>
                <button class="btn btn-secondary" onclick="openTgLink()">Open Link</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📩 Диалоги и Поп-апы</div>
            <div class="grid-2" style="margin-bottom: 10px;">
                <button class="btn btn-secondary" onclick="showAlert()">Alert</button>
                <button class="btn btn-secondary" onclick="showConfirm()">Confirm</button>
            </div>
            <button class="btn btn-secondary" onclick="scanQr()">Сканировать QR-код</button>
        </div>

        <div class="card">
            <div class="card-title">📤 Отправка данных боту</div>
            <div class="form-group">
                <label>Данные для отправки</label>
                <input type="text" id="sendDataInput" value='{"status": "ok", "action": "test"}'>
            </div>
            <button class="btn" onclick="sendDataToBot()">Send Data (sendData)</button>
        </div>
    </div>

    <!-- Вкладка 3: Настройки и Консоль -->
    <div id="settings-tab" class="tab-content animated">
        <div class="card">
            <div class="card-title">⚙️ Информация о Темы</div>
            <div class="list-item">
                <span>Цвет фона:</span>
                <b id="themeBg">-</b>
            </div>
            <div class="list-item">
                <span>Цвет текста:</span>
                <b id="themeText">-</b>
            </div>
            <div class="list-item">
                <span>Версия SDK:</span>
                <b id="sdkVersion">-</b>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🖥️ Лог событий</div>
            <div class="console-log" id="consoleLog">> WebApp Инициализирован...\n</div>
            <button class="btn btn-secondary" style="margin-top: 10px;" onclick="clearLog()">Очистить лог</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;

        // Элементы UI
        const logContainer = document.getElementById('consoleLog');

        // Кастомная функция логирования
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logContainer.innerText += `[${time}] ${msg}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 1. Инициализация при старте
        document.addEventListener("DOMContentLoaded", function() {
            tg.ready();
            tg.expand(); // Разворачиваем на весь экран

            // Настройка темы
            document.getElementById('themeBg').innerText = tg.backgroundColor || 'Стандартная';
            document.getElementById('themeText').innerText = tg.textColor || 'Стандартная';
            document.getElementById('sdkVersion').innerText = tg.version || 'Неизвестно';

            // Получение данных пользователя
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').innerText = `${user.first_name} ${user.last_name || ''}`;
                document.getElementById('userHandle').innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;
                document.getElementById('avatar').innerText = user.first_name.charAt(0).toUpperCase();
                log(`Пользователь: ${user.first_name} (ID: ${user.id})`);
            } else {
                document.getElementById('userName').innerText = "Гость (Браузер)";
                document.getElementById('userHandle').innerText = "@offline";
                document.getElementById('avatar').innerText = "G";
                log("Запуск вне Telegram или данные пользователя недоступны");
            }

            // Настройка MainButton по умолчанию
            tg.MainButton.setText("ОТПРАВИТЬ ДАННЫЕ").onClick(() => {
                log("Нажата MainButton!");
                sendDataToBot();
            });

            // Настройка BackButton
            tg.BackButton.onClick(() => {
                log("Нажата BackButton");
                tg.BackButton.hide();
            });

            // Загрузка сохраненных записей
            renderNotes();
        });

        // 2. Навигация по вкладкам
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            log(`Переключение на вкладку: ${tabId}`);
        }

        // 3. Сохранение данных (LocalStorage)
        function saveNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;

            let notes = JSON.parse(localStorage.getItem('webapp_notes') || '[]');
            notes.push({ text: text, date: new Date().toLocaleTimeString() });
            localStorage.setItem('webapp_notes', JSON.stringify(notes));

            input.value = '';
            renderNotes();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            log(`Заметка сохранена: "${text}"`);
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            let notes = JSON.parse(localStorage.getItem('webapp_notes') || '[]');
            
            if (notes.length === 0) {
                container.innerHTML = '<p style="color: var(--hint-color); font-size: 13px;">Записей пока нет.</p>';
                return;
            }

            container.innerHTML = notes.map((n, i) => `
                <div class="list-item">
                    <span>${n.text}</span>
                    <small style="color: var(--hint-color);">${n.date}</small>
                </div>
            `).join('');
        }

        function clearNotes() {
            localStorage.removeItem('webapp_notes');
            renderNotes();
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
            log("Все заметки удалены");
        }

        // 4. Функции Telegram SDK
        function toggleMainButton() {
            if (tg.MainButton.isVisible) {
                tg.MainButton.hide();
                log("MainButton скрыта");
            } else {
                tg.MainButton.show();
                log("MainButton показана");
            }
        }

        function toggleBackButton() {
            if (tg.BackButton.isVisible) {
                tg.BackButton.hide();
                log("BackButton скрыта");
            } else {
                tg.BackButton.show();
                log("BackButton показана");
            }
        }

        function triggerHaptic() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
                log("Сработал HapticFeedback (Heavy)");
            } else {
                log("HapticFeedback не поддерживается");
            }
        }

        function showAlert() {
            tg.showAlert("Это всплывающее окно Telegram Alert!", () => {
                log("Alert закрыт");
            });
        }

        function showConfirm() {
            tg.showConfirm("Вы уверены?", (confirmed) => {
                log(`Result confirm: ${confirmed}`);
            });
        }

        function openTgLink() {
            tg.openTelegramLink("https://t.me/telegram");
            log("Открыта ссылка Telegram");
        }

        function scanQr() {
            if (tg.showScanQrPopup) {
                tg.showScanQrPopup({ text: "Сканируйте QR код" }, (result) => {
                    log(`QR Сканирован: ${result}`);
                    return true; // Закрыть сканер
                });
            } else {
                log("Сканер QR не поддерживается в вашей версии");
            }
        }

        function sendDataToBot() {
            const val = document.getElementById('sendDataInput').value;
            log(`Отправка данных боту: ${val}`);
            try {
                tg.sendData(val); // Закрывает WebApp и отправляет данные боту
            } catch (e) {
                log(`Ошибка sendData: ${e.message} (Работает только если WebApp открыт через KeyboardButton)`);
            }
        }

        function clearLog() {
            logContainer.innerText = "";
        }
    </script>
</body>
</html>
