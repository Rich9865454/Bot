<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .user-info h3 { font-size: 16px; margin-bottom: 2px; }
        .user-info p { font-size: 12px; color: var(--text-muted); }

        .balance-card {
            text-align: center;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .balance-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; }
        .balance-value { font-size: 36px; font-weight: 800; color: var(--gold); margin: 10px 0; }

        .click-area { display: flex; justify-content: center; margin: 20px 0; }
        .click-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, var(--accent) 0%, var(--accent-hover) 100%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            font-size: 50px;
        }

        .click-btn:active { transform: scale(0.92); }

        .ref-stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card profile-header">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
            <h3 id="user-name">Загрузка...</h3>
            <p>Ваш ID: <span class="badge" id="user-id">00000000</span></p>
        </div>
    </div>

    <div class="card balance-card">
        <div class="balance-title">Баланс</div>
        <div class="balance-value">⚡ <span id="balance">0</span></div>
    </div>

    <div class="click-area">
        <button class="click-btn" id="click-btn">🚀</button>
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 5px;">🤝 Реферальная система</div>
        <div style="font-size: 12px; color: var(--text-muted);">Делитесь ссылкой и получайте бонусы за друзей</div>
        
        <div class="ref-stats">
            <span>Рефералов:</span>
            <strong id="ref-count">0</strong>
        </div>

        <button class="btn" id="copy-ref-btn">Скопировать ссылку</button>
    </div>
</div>

<script>
    // Инициализация Telegram API
    const tg = window.Telegram?.WebApp;
    
    if (tg) {
        tg.ready();
        tg.expand();
    }

    // ВАЖНО: Напишите юзернейм вашего бота БЕЗ символа @
    const BOT_USERNAME = "ИМЯ_ВАШЕГО_БОТА"; 

    // Безопасное получение данных Telegram
    const userData = tg?.initDataUnsafe?.user;
    const userId = userData?.id || "7777777"; // Фолбек-ID для тестов вне ТГ
    const userName = userData ? `${userData.first_name || ''} ${userData.last_name || ''}`.trim() : "Игрок (Тест)";

    document.getElementById("user-name").innerText = userName;
    document.getElementById("user-id").innerText = userId;
    document.getElementById("user-avatar").innerText = userName.charAt(0).toUpperCase();

    // Загрузка данных
    let balance = parseInt(localStorage.getItem(`bal_${userId}`)) || 0;
    let refCount = parseInt(localStorage.getItem(`refs_${userId}`)) || 0;

    document.getElementById("balance").innerText = balance;
    document.getElementById("ref-count").innerText = refCount;

    // Проверка клика
    document.getElementById("click-btn").addEventListener("click", () => {
        balance += 1;
        document.getElementById("balance").innerText = balance;
        localStorage.setItem(`bal_${userId}`, balance);

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.impactOccurred("light");
        }
    });

    // Копирование реф ссылки
    document.getElementById("copy-ref-btn").addEventListener("click", () => {
        const link = `https://t.me/${BOT_USERNAME}?start=${userId}`;
        
        if (navigator.clipboard) {
            navigator.clipboard.writeText(link);
            if (tg?.showAlert) {
                tg.showAlert("Реферальная ссылка скопирована!");
            } else {
                alert("Ссылка скопирована: " + link);
            }
        }
    });
</script>
</body>
</html>
